  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerceshop-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "123Pa$$$$$$$$word!"  # renders as 123Pa$$$$word!
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - ecom
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecommerceshop-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
